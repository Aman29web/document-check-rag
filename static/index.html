<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocumentChat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M8 7h6l3 3v7a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z' fill='white'/%3E%3C/svg%3E">
<style>
  /* ---------- Colours (light mode) ---------- */
  :root {
    --bg: #eef1fb;
    --blob: #a5b4fc;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-strong: rgba(255, 255, 255, 0.78);
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    --text: #111827;
    --muted: #5b6475;
    --line: rgba(17, 24, 39, 0.08);
    --accent: #6366f1;
    --accent-soft: rgba(99, 102, 241, 0.12);
    --on-accent: #ffffff;
    /* Solid indigo behind white text/icons: same in both themes so white stays readable */
    --accent-fill: #4f46e5;
    --soft-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.1);
    --quote-bg: rgba(99, 102, 241, 0.08);
  }

  /* ---------- Colours (dark mode) ---------- */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e1a;
      --blob: #3730a3;
      --glass: rgba(17, 24, 39, 0.5);
      --glass-strong: rgba(30, 37, 54, 0.72);
      --glass-border: rgba(255, 255, 255, 0.09);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      --soft-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
      --text: #e5e7eb;
      --muted: #9aa3b5;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #818cf8;
      --accent-soft: rgba(129, 140, 248, 0.16);
      --on-accent: #0b1020;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --quote-bg: rgba(129, 140, 248, 0.1);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    /* System fonts: no internet needed, and they look native on every device */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }

  /* Soft indigo glow behind the glass panels */
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .backdrop span {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: .7;
    animation: float 22s ease-in-out infinite alternate;
  }
  .backdrop span:nth-child(1) { width: 48vw; height: 48vw; background: var(--blob); top: -12vw; left: -10vw; }
  .backdrop span:nth-child(2) { width: 40vw; height: 40vw; background: var(--blob); bottom: -14vw; right: -8vw; opacity: .45; animation-delay: -7s; }
  @keyframes float { to { transform: translate(4vw, -3vw) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { .backdrop span { animation: none; } }

  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
  }

  /* ---------- Layout ---------- */
  .app {
    height: 100dvh;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 16px;
    padding: 16px;
  }

  button {
    font: inherit; color: inherit; cursor: pointer;
    border: none; background: none; padding: 0;
  }
  button:focus-visible, .doc:focus-visible, .upload:focus-within {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ---------- Sidebar ---------- */
  aside {
    border-radius: 20px;
    padding: 18px;
    display: flex; flex-direction: column; gap: 16px;
    min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; color: #fff;
    background: var(--accent-fill);
    box-shadow: var(--soft-shadow);
  }
  .brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .icon-button.close-sidebar { display: none; margin-left: auto; }

  .upload {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 18px 14px; text-align: center; cursor: pointer;
    border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 14px;
    background: var(--accent-soft);
    transition: background .2s, border-color .2s, transform .2s;
  }
  .upload:hover, .upload.drag { border-color: var(--accent); transform: translateY(-1px); }
  .upload .icon {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: var(--glass-strong); color: var(--accent);
  }
  .upload strong { font-size: 14px; font-weight: 600; }
  .upload small { color: var(--muted); font-size: 12px; }
  .upload.busy { pointer-events: none; opacity: .75; }

  .status {
    font-size: 13px; padding: 8px 10px; border-radius: 10px;
    display: none; align-items: center; gap: 8px;
  }
  .status.show { display: flex; }
  .status.info { background: var(--accent-soft); color: var(--accent); }
  .status.ok { background: var(--accent-soft); color: var(--accent); }
  .status.error { background: var(--danger-soft); color: var(--danger); }

  .section-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 4px 2px -6px;
  }
  .doc-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; flex: 1; margin: 0 -4px; padding: 0 4px; }
  .doc {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border-radius: 12px; border: 1px solid transparent;
    transition: background .15s, border-color .15s;
  }
  .doc:hover { background: var(--glass-strong); }
  .doc.selected { background: var(--glass-strong); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .doc .file-icon {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .doc .info { flex: 1; min-width: 0; }
  .doc .name { display: block; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc .meta { display: block; font-size: 12px; color: var(--muted); }
  .doc .delete {
    width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    color: var(--muted); opacity: 0; transition: opacity .15s, background .15s, color .15s;
  }
  .doc:hover .delete, .doc .delete:focus-visible { opacity: 1; }
  .doc .delete:hover { background: var(--danger-soft); color: var(--danger); }
  @media (hover: none) { .doc .delete { opacity: 1; } }
  .empty-docs { font-size: 13px; color: var(--muted); padding: 6px 4px; }

  .sidebar-foot { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---------- Chat area ---------- */
  main {
    border-radius: 20px;
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .icon-button.menu-button { display: none; }
  .scope { flex: 1; min-width: 0; }
  .scope small { display: block; font-size: 12px; color: var(--muted); }
  .scope strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-button {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: var(--glass-strong); border: 1px solid var(--glass-border);
    transition: transform .15s, background .15s;
  }
  .icon-button:hover { transform: translateY(-1px); }
  .pill-button {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 500;
    background: var(--glass-strong); border: 1px solid var(--glass-border);
    transition: transform .15s;
  }
  .pill-button:hover { transform: translateY(-1px); }

  .messages {
    flex: 1; overflow-y: auto; padding: 24px clamp(16px, 4vw, 48px);
    display: flex; flex-direction: column; gap: 18px;
    scroll-behavior: smooth;
  }

  .welcome { margin: auto; text-align: center; max-width: 520px; padding: 20px 0; }
  .welcome .logo { width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 14px; }
  .welcome .logo svg { width: 26px; height: 26px; }
  .welcome h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
  .welcome p { margin: 0 0 20px; color: var(--muted); }
  .suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .suggestion {
    text-align: left; padding: 12px 14px; border-radius: 14px; font-size: 14px;
    background: var(--glass-strong); border: 1px solid var(--glass-border);
    transition: transform .15s, border-color .15s;
  }
  .suggestion:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

  .row { display: flex; gap: 12px; max-width: 820px; width: 100%; animation: rise .25s ease-out; }
  .row.user { align-self: flex-end; justify-content: flex-end; }
  .row.bot { align-self: flex-start; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .avatar {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; color: #fff;
    background: var(--accent-fill);
  }
  .avatar svg { width: 16px; height: 16px; }

  .bubble { padding: 12px 16px; border-radius: 16px; min-width: 0; overflow-wrap: anywhere; }
  .row.user .bubble {
    background: var(--accent-fill);
    color: #fff; border-bottom-right-radius: 6px; white-space: pre-wrap;
    box-shadow: var(--soft-shadow);
  }
  .row.bot .bubble {
    background: var(--glass-strong); border: 1px solid var(--glass-border);
    border-top-left-radius: 6px; flex: 1;
  }
  .bubble.error { color: var(--danger); background: var(--danger-soft); }

  .answer { white-space: pre-wrap; }
  .quote {
    margin: 0 0 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--quote-bg); border-left: 3px solid var(--accent);
    font-size: 13.5px; color: var(--muted); white-space: pre-wrap;
  }
  .quote b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 2px; }

  .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 999px;
    background: var(--accent-soft);
  }
  .chip svg { width: 13px; height: 13px; }
  button.chip { color: var(--accent); font-weight: 500; }
  button.chip:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }

  .sources { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
  .sources.open { display: flex; }
  .source {
    padding: 10px 12px; border-radius: 12px; font-size: 13px;
    background: var(--glass); border: 1px solid var(--line);
  }
  .source-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-weight: 600; font-size: 12.5px; }
  .source-head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match { color: var(--accent); flex-shrink: 0; }
  .source p { margin: 0; color: var(--muted); white-space: pre-wrap; }

  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  /* ---------- Input ---------- */
  .composer { padding: 14px clamp(12px, 3vw, 24px) 16px; border-top: 1px solid var(--line); }
  .composer form {
    display: flex; align-items: flex-end; gap: 10px; max-width: 860px; margin: 0 auto;
    padding: 8px 8px 8px 16px; border-radius: 16px;
    background: var(--glass-strong); border: 1px solid var(--glass-border);
  }
  .composer form:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  textarea {
    flex: 1; resize: none; border: none; background: transparent; color: var(--text);
    font: inherit; padding: 8px 0; max-height: 160px; outline: none;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    color: #fff; background: var(--accent-fill);
    box-shadow: var(--soft-shadow);
    transition: transform .15s, opacity .15s;
  }
  .send:hover { transform: translateY(-1px); }
  .send:disabled { opacity: .45; cursor: default; transform: none; }
  .hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  .spinner {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .overlay { display: none; }

  /* ---------- Tablet & phone ---------- */
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
    aside {
      position: fixed; z-index: 20; top: 10px; bottom: 10px; left: 10px;
      width: min(320px, calc(100vw - 40px));
      background: var(--glass-strong);
      transform: translateX(calc(-100% - 20px));
      transition: transform .28s ease;
    }
    body.sidebar-open aside { transform: none; }
    .overlay {
      display: block; position: fixed; inset: 0; z-index: 10;
      background: rgba(0, 0, 0, .3); opacity: 0; pointer-events: none; transition: opacity .28s;
    }
    body.sidebar-open .overlay { opacity: 1; pointer-events: auto; }
    .icon-button.menu-button, .icon-button.close-sidebar { display: grid; }
    main { border-radius: 16px; }
    header { padding: 12px 14px; }
    .new-chat-label { display: none; }
    .pill-button { padding: 8px 10px; }
    .messages { padding: 18px 14px; }
    .row { gap: 8px; }
    .avatar { width: 28px; height: 28px; border-radius: 8px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"><span></span><span></span></div>
<div class="overlay" id="overlay"></div>

<div class="app">

  <!-- ---------- Sidebar ---------- -->
  <aside class="glass" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      </div>
      <div>
        <h1>DocumentChat</h1>
        <p>Ask questions about your files</p>
      </div>
      <button class="icon-button close-sidebar" id="closeSidebar" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <label class="upload" id="dropzone">
      <input type="file" id="fileInput" accept=".pdf,.docx" hidden>
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/></svg>
      </span>
      <strong>Upload a document</strong>
      <small>PDF or Word · click or drag here</small>
    </label>
    <div class="status" id="status" role="status"></div>

    <div class="section-title">Documents</div>
    <div class="doc-list">
      <button class="doc selected" data-id="" id="allDocs">
        <span class="file-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>
        </span>
        <span class="info"><span class="name">All documents</span><span class="meta" id="docCount">Search everything</span></span>
      </button>
      <div id="docList"></div>
    </div>

    <div class="sidebar-foot"><span class="dot"></span> Runs privately on this computer</div>
  </aside>

  <!-- ---------- Chat ---------- -->
  <main class="glass">
    <header>
      <button class="icon-button menu-button" id="openSidebar" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="scope">
        <small>Asking about</small>
        <strong id="scope">All documents</strong>
      </div>
      <button class="pill-button" id="newChat" aria-label="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="new-chat-label">New chat</span>
      </button>
    </header>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <form id="askForm">
        <textarea id="question" rows="1" placeholder="Ask about your documents..." aria-label="Question"></textarea>
        <button class="send" id="sendButton" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="hint">Enter to send · Shift + Enter for a new line · Answers can be wrong, so check the sources</div>
    </div>
  </main>
</div>

<script>
  let selectedId = "";             // "" means search all documents
  let selectedName = "All documents";
  let conversationId = null;       // set after the first answer
  let documentCount = 0;

  const messages = document.getElementById("messages");
  const statusBox = document.getElementById("status");
  const questionBox = document.getElementById("question");
  const sendButton = document.getElementById("sendButton");

  const ICONS = {
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
    logo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>'
  };

  function setStatus(text, kind = "info") {
    statusBox.className = `status show ${kind}`;
    statusBox.innerHTML = kind === "info" ? '<span class="spinner"></span>' : "";
    statusBox.append(text);
    if (kind === "ok") setTimeout(() => statusBox.classList.remove("show"), 4000);
  }

  async function readError(response) {
    try { return (await response.json()).detail; }
    catch { return `Server error (${response.status})`; }
  }

  // ---------- Mobile sidebar ----------
  const openSidebar = () => document.body.classList.add("sidebar-open");
  const closeSidebar = () => document.body.classList.remove("sidebar-open");
  document.getElementById("openSidebar").addEventListener("click", openSidebar);
  document.getElementById("closeSidebar").addEventListener("click", closeSidebar);
  document.getElementById("overlay").addEventListener("click", closeSidebar);

  // ---------- Documents ----------

  async function loadDocuments() {
    const response = await fetch("/documents");
    const documents = await response.json();
    documentCount = documents.length;
    const list = document.getElementById("docList");
    list.innerHTML = "";

    document.getElementById("docCount").textContent =
      documents.length ? `Search all ${documents.length} file${documents.length > 1 ? "s" : ""}` : "No files yet";

    for (const doc of documents) {
      const row = document.createElement("div");
      row.className = "doc" + (doc.document_id === selectedId ? " selected" : "");
      row.dataset.id = doc.document_id;
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      row.innerHTML = `
        <span class="file-icon">${ICONS.file}</span>
        <span class="info"><span class="name"></span><span class="meta">${doc.chunks} chunks</span></span>
        <button class="delete" aria-label="Delete document">${ICONS.trash}</button>`;
      row.querySelector(".name").textContent = doc.filename;
      row.querySelector(".name").title = doc.filename;

      row.addEventListener("click", () => selectDocument(doc.document_id, doc.filename));
      row.addEventListener("keydown", (e) => { if (e.key === "Enter") selectDocument(doc.document_id, doc.filename); });
      row.querySelector(".delete").addEventListener("click", (event) => {
        event.stopPropagation();
        deleteDocument(doc.document_id, doc.filename);
      });
      list.appendChild(row);
    }

    // If the selected document was deleted, go back to "All documents"
    if (selectedId && !documents.some(d => d.document_id === selectedId)) {
      selectDocument("", "All documents");
    } else if (!conversationId) {
      showWelcome();
    }
  }

  function selectDocument(id, name) {
    closeSidebar();
    if (id === selectedId) return;
    selectedId = id;
    selectedName = id ? name : "All documents";
    document.querySelectorAll(".doc").forEach(row => {
      row.classList.toggle("selected", row.dataset.id === id);
    });
    document.getElementById("scope").textContent = selectedName;
    startNewChat();
  }

  async function uploadFile(file) {
    if (!file) return;
    const dropzone = document.getElementById("dropzone");
    dropzone.classList.add("busy");
    setStatus(`Reading ${file.name}...`);
    const form = new FormData();
    form.append("file", file);

    try {
      const response = await fetch("/documents", { method: "POST", body: form });
      if (!response.ok) {
        setStatus(await readError(response), "error");
        return;
      }
      const result = await response.json();
      setStatus(result.already_uploaded
        ? `${file.name} was already uploaded`
        : `${file.name} is ready (${result.chunks} chunks)`, "ok");
      await loadDocuments();
      selectDocument(result.document_id, file.name);
    } catch {
      setStatus("Cannot reach the server. Is uvicorn running?", "error");
    } finally {
      dropzone.classList.remove("busy");
    }
  }

  async function deleteDocument(id, name) {
    if (!confirm(`Delete "${name}"?`)) return;
    const response = await fetch(`/documents/${id}`, { method: "DELETE" });
    if (!response.ok) setStatus(await readError(response), "error");
    else setStatus(`${name} deleted`, "ok");
    await loadDocuments();
  }

  const fileInput = document.getElementById("fileInput");
  const dropzone = document.getElementById("dropzone");
  fileInput.addEventListener("change", () => { uploadFile(fileInput.files[0]); fileInput.value = ""; });
  dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("drag");
    uploadFile(e.dataTransfer.files[0]);
  });
  document.getElementById("allDocs").addEventListener("click", () => selectDocument("", "All documents"));

  // ---------- Chat ----------

  function showWelcome() {
    const hasDocs = documentCount > 0;
    messages.innerHTML = `
      <div class="welcome">
        <div class="logo">${ICONS.logo}</div>
        <h2>${hasDocs ? "What would you like to know?" : "Upload a document to begin"}</h2>
        <p></p>
        <div class="suggestions"></div>
      </div>`;
    messages.querySelector("p").textContent = hasDocs
      ? `Ask anything about ${selectedId ? selectedName : "your documents"}. Answers include the exact quote and page they came from.`
      : "Add a PDF or Word file from the sidebar. Scanned PDFs work too.";

    if (hasDocs) {
      const box = messages.querySelector(".suggestions");
      for (const text of ["Summarize this document", "What are the key dates mentioned?",
                          "List the most important numbers", "Who is this document about?"]) {
        const button = document.createElement("button");
        button.className = "suggestion";
        button.textContent = text;
        button.addEventListener("click", () => ask(text));
        box.appendChild(button);
      }
    }
  }

  function startNewChat() {
    conversationId = null;
    showWelcome();
  }

  function addRow(kind) {
    messages.querySelector(".welcome")?.remove();
    const row = document.createElement("div");
    row.className = "row " + kind;
    if (kind === "bot") row.innerHTML = `<div class="avatar">${ICONS.bot}</div>`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
  }

  // The model answers as "Quote: ... Answer: ... Source: ...". Split it up for display.
  function splitAnswer(text) {
    const match = text.match(/Quote:\s*([\s\S]*?)\s*Answer:\s*([\s\S]*)/i);
    if (!match) return { quote: "", answer: text.trim() };
    let quote = match[1].trim().replace(/^["“]|["”]$/g, "").replace(/\[Source \d+\]\s*$/, "").trim();
    const answer = match[2].replace(/\n\s*Source:[\s\S]*$/i, "").trim();
    if (!quote || /could not find/i.test(quote)) quote = "";
    return { quote, answer };
  }

  function renderAnswer(bubble, result) {
    const { quote, answer } = splitAnswer(result.answer);
    bubble.innerHTML = "";

    if (quote) {
      const block = document.createElement("div");
      block.className = "quote";
      block.innerHTML = "<b>From the document</b>";
      block.append(quote);
      bubble.appendChild(block);
    }

    const answerText = document.createElement("div");
    answerText.className = "answer";
    answerText.textContent = answer;
    bubble.appendChild(answerText);

    const meta = document.createElement("div");
    meta.className = "meta-row";
    const toggle = document.createElement("button");
    toggle.className = "chip";
    toggle.innerHTML = `${ICONS.book} ${result.sources.length} sources`;
    meta.appendChild(toggle);

    if (result.searched_for && result.searched_for !== result.question) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = ICONS.search;
      chip.append(`Searched: ${result.searched_for}`);
      meta.appendChild(chip);
    }
    bubble.appendChild(meta);

    const list = document.createElement("div");
    list.className = "sources";
    result.sources.forEach((source, index) => {
      const card = document.createElement("div");
      card.className = "source";
      card.innerHTML = '<div class="source-head"><span></span><span class="match"></span></div><p></p>';
      card.querySelector(".source-head span").textContent =
        `[${index + 1}] ${source.filename}` + (source.page !== null ? ` · page ${source.page}` : "");
      card.querySelector(".match").textContent = `${Math.round(source.similarity * 100)}% match`;
      card.querySelector("p").textContent =
        source.text.length > 420 ? source.text.slice(0, 420) + "..." : source.text;
      list.appendChild(card);
    });
    bubble.appendChild(list);
    toggle.addEventListener("click", () => {
      list.classList.toggle("open");
      if (list.classList.contains("open")) list.scrollIntoView({ block: "nearest", behavior: "smooth" });
    });
  }

  async function ask(question) {
    if (sendButton.disabled) return;
    sendButton.disabled = true;
    addRow("user").textContent = question;
    const bubble = addRow("bot");
    bubble.innerHTML = '<span class="typing" aria-label="Thinking"><i></i><i></i><i></i></span>';

    try {
      const response = await fetch("/documents/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: question,
          document_id: selectedId || null,
          conversation_id: conversationId
        })
      });

      if (!response.ok) {
        const error = await readError(response);
        // The server forgot this conversation (e.g. it restarted), so start over
        if (response.status === 404 && conversationId) conversationId = null;
        bubble.classList.add("error");
        bubble.textContent = error;
        return;
      }

      const result = await response.json();
      conversationId = result.conversation_id;
      renderAnswer(bubble, result);
    } catch {
      bubble.classList.add("error");
      bubble.textContent = "Cannot reach the server. Is uvicorn running?";
    } finally {
      sendButton.disabled = false;
      messages.scrollTop = messages.scrollHeight;
      questionBox.focus();
    }
  }

  // Grow the text box as you type (up to a limit)
  function resizeQuestionBox() {
    questionBox.style.height = "auto";
    questionBox.style.height = questionBox.scrollHeight + "px";
  }
  questionBox.addEventListener("input", resizeQuestionBox);

  document.getElementById("askForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const question = questionBox.value.trim();
    if (!question || sendButton.disabled) return;
    questionBox.value = "";
    resizeQuestionBox();
    ask(question);
  });
  questionBox.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      document.getElementById("askForm").requestSubmit();
    }
  });
  document.getElementById("newChat").addEventListener("click", startNewChat);

  loadDocuments();
</script>
</body>
</html>
